receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

  # ============================================================
  # STAGE 1: DEFAULT DENY / SCHEMA ALLOWLIST
  # ============================================================

  transform/default_deny:
    error_mode: propagate

    trace_statements:
      - context: resource
        statements:
          - 'keep_keys(resource.attributes, [
            "service.name",
            "deployment.environment.name"
            ])'

      - context: span
        statements:
          - 'keep_keys(attributes, [
            "http.route",
            "http.response.status_code",
            "duration_ms",
            "demo.run_id",
            "demo.scenario",
            "payment.status",
            "payment.attempt_id"
            ])'

    log_statements:
      - context: resource
        statements:
          - 'keep_keys(resource.attributes, [
            "service.name",
            "deployment.environment.name"
            ])'

      - context: log
        statements:
          - 'keep_keys(attributes, [
            "event.name",
            "demo.run_id",
            "demo.scenario",
            "payment.status",
            "payment.attempt_id"
            ])'

  # ============================================================
  # STAGE 2: CONTENT SANITIZATION
  # ============================================================

  redaction/pci:
    allow_all_keys: true
    redact_all_types: true

    blocked_values:
      # Numeric boundaries also detect PANs beside letters and underscores.
      - '(^|[^0-9])[0-9]{13,19}([^0-9]|$)'
      - '(^|[^0-9])(?:[0-9][ -]?){12,18}[0-9]([^0-9]|$)'
      - '%B[0-9]{13,19}\^[^^]+\^[^?]+\?'
      - ';[0-9]{13,19}=[^?]+\?'
      - '(?i)bearer\s+[A-Za-z0-9._~+/=-]+'
      - '(?i)basic\s+[A-Za-z0-9+/=]+'

    summary: debug

  # ============================================================
  # STAGE 3: DROP RECORDS THAT WERE REDACTED
  #
  # Wenn der Redaction Processor etwas gefunden hat,
  # wird der komplette Span bzw. Log Record verworfen.
  # ============================================================

  filter/drop_sensitive:
    error_mode: propagate

    traces:
      span:
        - 'attributes["redaction.masked.count"] != nil and attributes["redaction.masked.count"] > 0'

    logs:
      log_record:
        - 'attributes["redaction.masked.count"] != nil and attributes["redaction.masked.count"] > 0'

  batch: {}

exporters:
  debug:
    verbosity: detailed

  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - transform/default_deny
        - redaction/pci
        - filter/drop_sensitive
        - batch

      exporters:
        - debug
        - otlp/lgtm

    logs:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - transform/default_deny
        - redaction/pci
        - filter/drop_sensitive
        - batch

      exporters:
        - debug
        - otlp/lgtm
